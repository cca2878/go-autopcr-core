name: CI

on:
  push:
  pull_request:

# 硬性约束：全程禁用 CGO。
env:
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Verify no CGO
        run: |
          go build -o bin/autopcr-cli ./cmd/autopcr-cli
          go version -m bin/autopcr-cli | grep -q 'CGO_ENABLED=0'

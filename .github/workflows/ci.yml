name: CI

# 验证类 CI（dev/main 模型）：dev=snapshot 验证；main=PR 门禁与合并后正式验证。
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 硬性约束：全程禁用 CGO。
env:
  CGO_ENABLED: "0"

jobs:
  go:
    # 显示名即分支保护 required_status_checks 的 context（与 bsdk/gtrv 通用 ruleset 一致）。
    name: Go (fmt · vet · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "以下文件未 gofmt："; echo "$unformatted"; exit 1; fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # 本仓是纯库，没有可执行产物可供读取内嵌构建设置，故编译一个测试二进制来读——
      # masterdata 恰是链接 sqlite（最可能引入 CGO 的依赖）的地方。
      - name: Verify no CGO
        run: |
          go test -c -o /tmp/cgocheck.test ./internal/client/masterdata
          go version -m /tmp/cgocheck.test | grep -q 'CGO_ENABLED=0'
